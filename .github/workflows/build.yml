name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build game audio capture helper
        shell: cmd
        run: |
          mkdir vendor
          cl /nologo /EHsc /O2 /std:c++17 /utf-8 /W3 native\audio_capture\main.cpp /Fe:vendor\lol_audio_capture.exe /link ole32.lib mmdevapi.lib

      - name: Download FFmpeg (BtbN GPL build, 7.1)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName vendor\
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") vendor\
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName vendor\FFMPEG_LICENSE.txt
          vendor\ffmpeg.exe -hide_banner -filters | Select-String "ddagrab|scale_cuda|scale_qsv"
          vendor\ffmpeg.exe -hide_banner -encoders | Select-String "nvenc|amf|qsv|libx264"

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: Run tests (Windows)
        run: pytest -q

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/lolrec.spec

      - name: Smoke check bundled binaries
        shell: pwsh
        run: |
          Get-ChildItem dist\LoLRecorder\_internal\bin
          dist\LoLRecorder\_internal\bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          $p = Start-Process dist\LoLRecorder\_internal\bin\lol_audio_capture.exe -ArgumentList "--pid","4","--pipe","\\.\pipe\lolrec_ci" -NoNewWindow -PassThru -RedirectStandardOutput helper.txt
          Start-Sleep 3; if (!$p.HasExited) { $p.Kill() }; Get-Content helper.txt
          Copy-Item vendor\FFMPEG_LICENSE.txt dist\LoLRecorder\

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path lolrec\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist\LoLRecorder\* -DestinationPath dist\LoLRecorder-portable-${{ steps.ver.outputs.version }}.zip

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          } else { $iscc = "iscc" }
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: LoLRecorder-${{ steps.ver.outputs.version }}
          path: |
            dist/LoLRecorder-Setup-*.exe
            dist/LoLRecorder-portable-*.zip

      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LoLRecorder-Setup-*.exe
            dist/LoLRecorder-portable-*.zip
