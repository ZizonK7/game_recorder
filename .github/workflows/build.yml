name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build game audio capture helper
        shell: cmd
        run: |
          mkdir vendor
          cl /nologo /EHsc /O2 /std:c++17 /utf-8 /W3 native\audio_capture\main.cpp /Fe:vendor\lol_audio_capture.exe /link ole32.lib mmdevapi.lib

      - name: Download FFmpeg (needs ddagrab + NVENC/AMF/QSV)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 게임 성능을 위해 NVIDIA/AMD/Intel 하드웨어 인코더가 모두 들어 있는 빌드를 고른다.
          # 후보를 차례로 받아보고 조건을 만족하는 첫 빌드를 사용.
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "lolrec-ci" }
          $candidates = @()
          try {
            $rel = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest" -Headers $headers
            $stable = $rel.assets | Where-Object { $_.name -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-gpl-\d+\.\d+\.zip$' } |
              Sort-Object { [int]($_.name -replace '^ffmpeg-n(\d+)\.(\d+).*', '$1') * 100 + [int]($_.name -replace '^ffmpeg-n(\d+)\.(\d+).*', '$2') } -Descending
            $candidates += $stable | ForEach-Object { $_.browser_download_url }
            $candidates += ($rel.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-gpl.zip' }).browser_download_url
          } catch { Write-Host "BtbN release 조회 실패: $_" }
          $candidates += "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $candidates += "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.zip"
          $chosen = $null
          foreach ($url in ($candidates | Where-Object { $_ })) {
            Write-Host "후보: $url"
            Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force -ErrorAction SilentlyContinue
            try { Invoke-WebRequest $url -OutFile ffmpeg.zip } catch { Write-Host "  다운로드 실패"; continue }
            Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
            $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            if (-not $bin) { continue }
            $enc = & $bin.FullName -hide_banner -encoders | Out-String
            $flt = & $bin.FullName -hide_banner -filters | Out-String
            $ok = ($flt -match 'ddagrab') -and ($enc -match 'h264_nvenc') -and ($enc -match 'h264_amf') -and ($enc -match 'h264_qsv') -and ($enc -match 'libx264')
            Write-Host ("  ddagrab={0} nvenc={1} amf={2} qsv={3} x264={4}" -f ($flt -match 'ddagrab'), ($enc -match 'h264_nvenc'), ($enc -match 'h264_amf'), ($enc -match 'h264_qsv'), ($enc -match 'libx264'))
            if ($ok) { $chosen = $bin; break }
          }
          if (-not $chosen) { throw "조건(ddagrab + NVENC/AMF/QSV/x264)을 만족하는 FFmpeg 빌드를 찾지 못했습니다" }
          Write-Host "선택: $($chosen.FullName)"
          # shared 빌드면 DLL 도 함께 복사
          Copy-Item (Join-Path $chosen.DirectoryName "*") vendor\ -Include *.exe, *.dll -Exclude ffplay.exe
          $lic = Get-ChildItem ffmpeg_tmp -Recurse -Include LICENSE*, COPYING* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName vendor\FFMPEG_LICENSE.txt }
          vendor\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: Run tests (Windows)
        run: pytest -q

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/lolrec.spec

      - name: Smoke check bundled binaries
        shell: pwsh
        run: |
          Get-ChildItem dist\LoLRecorder\_internal\bin
          dist\LoLRecorder\_internal\bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          $p = Start-Process dist\LoLRecorder\_internal\bin\lol_audio_capture.exe -ArgumentList "--pid","4","--pipe","\\.\pipe\lolrec_ci" -NoNewWindow -PassThru -RedirectStandardOutput helper.txt
          Start-Sleep 3; if (!$p.HasExited) { $p.Kill() }; Get-Content helper.txt
          if (Test-Path vendor\FFMPEG_LICENSE.txt) { Copy-Item vendor\FFMPEG_LICENSE.txt dist\LoLRecorder\ }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path lolrec\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist\LoLRecorder\* -DestinationPath dist\LoLRecorder-portable-${{ steps.ver.outputs.version }}.zip

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          } else { $iscc = "iscc" }
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: LoLRecorder-${{ steps.ver.outputs.version }}
          path: |
            dist/LoLRecorder-Setup-*.exe
            dist/LoLRecorder-portable-*.zip

      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LoLRecorder-Setup-*.exe
            dist/LoLRecorder-portable-*.zip
